[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rashomon-py"
version = "0.3.0"
description = "Does your conclusion survive every equally-good model? Multiplicity audits for scikit-learn linear models."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  { name = "rashomon-py contributors" }
]
keywords = ["rashomon", "predictive multiplicity", "model multiplicity", "interpretability", "stability", "logistic regression", "scikit-learn"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "pandas>=1.5",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
full = [
  "seaborn>=0.12",
  "tqdm>=4.65",
]

[project.urls]
Homepage = "https://github.com/fxcawley/StableGLM"
Documentation = "https://fxcawley.github.io/StableGLM/"
Issues = "https://github.com/fxcawley/StableGLM/issues"
Changelog = "https://github.com/fxcawley/StableGLM/blob/main/CHANGELOG.md"

[tool.hatch.build]
packages = ["rashomon"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["rashomon", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B", "PIE", "Q", "W"
]
# E501: long lines; UP006/UP007/UP035/UP045: keep typing.Optional/Dict style (py39 target,
# not every module imports annotations from __future__).
ignore = ["E501", "UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["rashomon"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"