name: Publish to PyPI

# Manual step. Uses PyPI trusted publishing (OIDC), so no API token is stored;
# PyPI must be configured to trust this workflow first:
#   https://pypi.org/manage/account/publishing/
#   owner fxcawley, repository StableGLM, workflow publish-pypi.yml, environment pypi
# Then run this workflow with the release tag (e.g. v0.2.0).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build ${{ inputs.tag }} and upload to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rashomon-py/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Check the tag matches the package version
        run: |
          pkg_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag_version="${TAG#v}"
          test "$pkg_version" = "$tag_version" || { echo "pyproject version $pkg_version != tag $tag_version"; exit 1; }
        env:
          TAG: ${{ inputs.tag }}
      - name: Publish
        # v1.14.2 (2026-07-29), pinned by commit SHA
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
